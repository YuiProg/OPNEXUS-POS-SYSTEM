limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

split_clients "${remote_addr}${request_id}" $backend_host {
    50%     ${BACKEND_HOST_1};
    *       ${BACKEND_HOST_2};
}

server {
    listen 80;
    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 valid=30s ipv6=off;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        error_page 502 503 504 = @fallback;

        set $primary "https://${backend_host}";
        proxy_pass $primary;
    }

    location @fallback {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 valid=30s ipv6=off;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        set $fallback_host "";
        if ($backend_host = "${BACKEND_HOST_1}") {
            set $fallback_host "${BACKEND_HOST_2}";
        }
        if ($backend_host = "${BACKEND_HOST_2}") {
            set $fallback_host "${BACKEND_HOST_1}";
        }

        set $secondary "https://${fallback_host}";
        proxy_pass $secondary;
    }
}
