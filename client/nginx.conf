limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        error_page 502 503 504 = @backend2;

        proxy_ssl_name ${BACKEND_HOST_1};
        proxy_set_header Host ${BACKEND_HOST_1};
        proxy_pass https://${BACKEND_HOST_1};
    }

    location @backend2 {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_ssl_name ${BACKEND_HOST_2};
        proxy_set_header Host ${BACKEND_HOST_2};
        proxy_pass https://${BACKEND_HOST_2};
    }
}
