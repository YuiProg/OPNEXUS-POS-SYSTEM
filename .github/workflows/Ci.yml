name: CI/CD
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (Backend)
        working-directory: backend
        run: npx eslint . --max-warnings=0

      - name: Run ESLint (Client)
        working-directory: client
        run: npx eslint . --max-warnings=0

  backend:
    name: Backend - Install & Check
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci

  client:
    name: Client - Install & Build
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build Vite app
        working-directory: client
        run: npm run build

  docker:
    name: Docker - Build Check
    runs-on: ubuntu-latest
    needs: [backend, client]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create dummy .env for build
        run: |
          echo "PORT=3000" > backend/.env
          echo "MONGO_URI=mongodb://dummy:27017/test" >> backend/.env
          echo "CLIENT_URL=http://localhost" >> backend/.env
      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}