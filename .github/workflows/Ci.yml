name: CI/CD
on:
  push:
    branches: [main, dev-staging]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Run ESLint (Backend)
        working-directory: backend
        run: npx eslint . --max-warnings=0
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Run ESLint (Frontend)
        working-directory: client
        run: npx eslint . --max-warnings=0

  backend:
    name: Backend - Install & Check
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

  frontend:
    name: Frontend - Install & Check
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: ''

  docker-backend:
    name: Docker - Backend Build Check
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create dummy .env for build
        run: |
          echo "PORT=3000" > backend/.env
          echo "MONGO_URI=mongodb://dummy:27017/test" >> backend/.env
          echo "CLIENT_URL=http://localhost" >> backend/.env
      - name: Build backend Docker image
        run: docker build ./backend -t opnexus-pos-backend

  docker-frontend:
    name: Docker - Frontend Build Check
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build ./client -t opnexus-pos-frontend
        env:
          VITE_API_URL: ''

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [docker-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook (Backend 1)
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Trigger Render Deploy Hook (Backend 2)
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK_2 }}

  deploy-frontend:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    needs: [docker-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
